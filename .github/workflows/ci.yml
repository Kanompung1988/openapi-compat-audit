name: Verify standalone Agent Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / tests & fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile CLI and regression tests
        run: python -m compileall -q scripts tests qa
      - name: Unit and brand-integrity tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic CLI fixture
        run: python qa/smoke.py
